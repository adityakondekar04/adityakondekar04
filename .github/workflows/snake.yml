name: Generate Contribution Snake

on:
  schedule:
    # Runs automatically every day at 00:17 UTC
    - cron: "17 0 * * *"
  # Allows manual workflow trigger from GitHub Actions tab
  workflow_dispatch:
  # Runs automatically when changes are pushed to this workflow file
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generates snake animation SVGs from user contribution graph
      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: adityakondekar04
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Deploys the generated SVGs in dist/ to the output branch
      # Uses the repository's built-in GITHUB_TOKEN (no Personal Access Token required)
      - name: Publish snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
